name: Build All APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer Cython==0.29.36

    - name: Extract Project Zip
      run: |
        unzip app_project.zip -d extracted_apps
        ls -la extracted_apps

    - name: Find and Build Apps
      run: |
        cd extracted_apps
        for dir in */; do
          if [ -d "$dir" ]; then
            echo "Building app in $dir"
            cd "$dir"
            if [ -f "buildozer.spec" ]; then
              yes | buildozer -v android debug
            fi
            cd ..
          fi
        done
    - name: Upload APKs Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: extracted_apps/**/bin/*.apk

