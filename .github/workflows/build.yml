name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Prepare Project Workspace
      run: |
        mkdir -p my_app
        unzip -o app_project.zip -d my_app/ || true
        cd my_app
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
          sed -i 's/# title = My Application/title = MyPythonApp/' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = mypythonapp/' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = org.ayman/' buildozer.spec
          sed -i 's/# source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
          sed -i 's/# source.main = main.py/source.main = parent_app.py/' buildozer.spec
        fi

    - name: Build with Buildozer
      run: |
        cd my_app
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: my_app/bin/*.apk
