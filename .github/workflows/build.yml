name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build All Apps Directly
      run: |
        mkdir -p all_apps_output
        
        for app_file in child_app.py parent_app.py key_generator.py; do
          if [ -f "$app_file" ]; then
            echo "=================================="
            echo "Building APK for: $app_file"
            echo "=================================="
            
            app_dir="app_${app_file%.py}"
            mkdir -p "$app_dir"
            
            cp "$app_file" "$app_dir/main.py"
            [ -f "serviceAccountKey.json" ] && cp "serviceAccountKey.json" "$app_dir/"
            
            cd "$app_dir"
            
            buildozer init
            sed -i "s/# title = My Application/title = ${app_file%.py}/" buildozer.spec
            sed -i "s/# package.name = myapp/package.name = ${app_file%.py}/" buildozer.spec
            sed -i 's/# package.domain = org.test/package.domain = org.ayman/' buildozer.spec
            sed -i 's/# source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
            
            yes | buildozer -v android debug
            
            mkdir -p ../all_apps_output
            cp bin/*.apk ../all_apps_output/${app_file%.py}.apk || true
            
            cd ..
          fi
        done

    - name: Upload All APKs Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-my-apks
        path: all_apps_output/*.apk
